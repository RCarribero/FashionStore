<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#grid)" />
  <circle cx="400" cy="450" r="350" fill="url(#glow)" />

  <!-- Studio Ambient Lighting Frame -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" rx="16" />

  <!-- Category & Brand Header -->
  <text x="60" y="80" fill="#38bdf8" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="4">FASHIONMARKET // CHAQUETAS</text>
  <text x="740" y="80" text-anchor="end" fill="#ffffff" fill-opacity="0.3" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="2">ED. 2026</text>

  <!-- Main Illustration Group with Filter -->
  <g filter="url(#shadow)" transform="translate(0, 20)">
    
          <!-- Bomber Jacket Illustration -->
          <!-- Ribbed Collar -->
          <path d="M300 240 Q400 290 500 240 Q480 200 400 220 Q320 200 300 240 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
          <!-- Torso -->
          <path d="M220 310 L280 245 Q400 290 520 245 L580 310 L560 620 Q400 640 240 620 Z" fill="#0f172a" stroke="#334155" stroke-width="3" />
          <!-- Left Sleeve -->
          <path d="M220 310 L140 480 Q130 550 170 570 L210 540 L240 400 Z" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
          <!-- Right Sleeve -->
          <path d="M580 310 L660 480 Q670 550 630 570 L590 540 L560 400 Z" fill="#0b1120" stroke="#1e293b" stroke-width="2" />
          <!-- Front Metal Zipper -->
          <line x1="400" y1="265" x2="400" y2="628" stroke="#94a3b8" stroke-width="6" stroke-dasharray="8 3" />
          <rect x="393" y="350" width="14" height="26" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
          <!-- Chest Flight Pocket -->
          <rect x="440" y="360" width="80" height="95" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2" />
          <line x1="440" y1="385" x2="520" y2="385" stroke="#38bdf8" stroke-width="2" />
          <!-- Ribbed Bottom Hem -->
          <rect x="235" y="620" width="330" height="45" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
          <line x1="240" y1="635" x2="560" y2="635" stroke="#334155" stroke-width="2" />
          <line x1="240" y1="645" x2="560" y2="645" stroke="#334155" stroke-width="2" />
          <!-- Sleek Aviator Badge -->
          <circle cx="320" cy="380" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
          <polygon points="320,366 327,388 313,388" fill="#38bdf8" />
        
  </g>

  <!-- Bottom Product Tag -->
  <rect x="50" y="860" width="700" height="90" rx="12" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="80" y="905" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="1">CAZADORA BOMBER AVIATOR OBSIDIAN</text>
  <text x="80" y="930" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">PREMIUM EDITION • STUDIO MOCKUP</text>
  
  <rect x="660" y="885" width="60" height="38" rx="6" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.6" />
  <text x="690" y="909" text-anchor="middle" fill="#38bdf8" font-family="'Inter', sans-serif" font-size="12" font-weight="800">FM</text>
</svg>