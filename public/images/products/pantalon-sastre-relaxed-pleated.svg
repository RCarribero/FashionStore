<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="50%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#grid)" />
  <circle cx="400" cy="450" r="350" fill="url(#glow)" />

  <!-- Studio Ambient Lighting Frame -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" rx="16" />

  <!-- Category & Brand Header -->
  <text x="60" y="80" fill="#94a3b8" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="4">FASHIONMARKET // PANTALONES</text>
  <text x="740" y="80" text-anchor="end" fill="#ffffff" fill-opacity="0.3" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="2">ED. 2026</text>

  <!-- Main Illustration Group with Filter -->
  <g filter="url(#shadow)" transform="translate(0, 20)">
    
          <!-- Tailored Pleated Dress Trousers -->
          <!-- Clean Waistband with Extended Tab -->
          <rect x="260" y="220" width="280" height="35" rx="4" fill="#334155" stroke="#94a3b8" stroke-width="2" />
          <!-- Double Pleats Crease Lines -->
          <line x1="320" y1="255" x2="300" y2="700" stroke="#64748b" stroke-width="2.5" />
          <line x1="345" y1="255" x2="335" y2="400" stroke="#475569" stroke-width="2" />
          <line x1="480" y1="255" x2="500" y2="700" stroke="#64748b" stroke-width="2.5" />
          <line x1="455" y1="255" x2="465" y2="400" stroke="#475569" stroke-width="2" />
          <!-- Main Cut -->
          <path d="M260 255 L240 420 L370 450 L400 420 L430 450 L560 420 L540 255 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
          <!-- Left Leg Relaxed -->
          <path d="M240 420 L220 720 L360 720 L370 450 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
          <!-- Right Leg Relaxed -->
          <path d="M560 420 L580 720 L440 720 L430 450 Z" fill="#1e293b" stroke="#334155" stroke-width="2" />
          <!-- Tailored Hem Turn-Up Cuffs -->
          <rect x="215" y="700" width="150" height="25" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
          <rect x="435" y="700" width="150" height="25" rx="2" fill="#334155" stroke="#94a3b8" stroke-width="1.5" />
        
  </g>

  <!-- Bottom Product Tag -->
  <rect x="50" y="860" width="700" height="90" rx="12" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="80" y="905" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="1">PANTALÓN SASTRE RELAXED PLEATED</text>
  <text x="80" y="930" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">PREMIUM EDITION • STUDIO MOCKUP</text>
  
  <rect x="660" y="885" width="60" height="38" rx="6" fill="#94a3b8" fill-opacity="0.2" stroke="#94a3b8" stroke-opacity="0.6" />
  <text x="690" y="909" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12" font-weight="800">FM</text>
</svg>