<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e29" />
      <stop offset="50%" stop-color="#24143d" />
      <stop offset="100%" stop-color="#0d0617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#grid)" />
  <circle cx="400" cy="450" r="350" fill="url(#glow)" />

  <!-- Studio Ambient Lighting Frame -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" rx="16" />

  <!-- Category & Brand Header -->
  <text x="60" y="80" fill="#c084fc" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="4">FASHIONMARKET // SUDADERAS</text>
  <text x="740" y="80" text-anchor="end" fill="#ffffff" fill-opacity="0.3" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="2">ED. 2026</text>

  <!-- Main Illustration Group with Filter -->
  <g filter="url(#shadow)" transform="translate(0, 20)">
    
          <!-- Oversize Hoodie -->
          <!-- Hood -->
          <path d="M280 260 C260 160 540 160 520 260 C480 300 320 300 280 260 Z" fill="#2e1065" stroke="#c084fc" stroke-width="2.5" />
          <path d="M330 250 C340 210 460 210 470 250 C440 280 360 280 330 250 Z" fill="#1e1b4b" />
          <!-- Drawstrings -->
          <path d="M370 270 Q365 370 350 400" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" fill="none" />
          <path d="M430 270 Q435 370 450 400" stroke="#f1f5f9" stroke-width="4" stroke-linecap="round" fill="none" />
          <!-- Torso Oversize -->
          <path d="M210 320 L270 260 C330 280 470 280 530 260 L590 320 L575 640 L225 640 Z" fill="#3b0764" stroke="#581c87" stroke-width="3" />
          <!-- Kangaroo Pocket -->
          <path d="M290 480 L510 480 L490 590 L310 590 Z" fill="#2e1065" stroke="#c084fc" stroke-width="2" />
          <!-- Sleeves Dropped Shoulder -->
          <path d="M210 320 L110 500 Q105 560 155 570 L195 530 L225 410 Z" fill="#2e1065" stroke="#581c87" stroke-width="2" />
          <path d="M590 320 L690 500 Q695 560 645 570 L605 530 L575 410 Z" fill="#2e1065" stroke="#581c87" stroke-width="2" />
          <!-- Acid Wash Texture Splatters -->
          <circle cx="340" cy="380" r="14" fill="#a855f7" fill-opacity="0.3" />
          <circle cx="460" cy="420" r="22" fill="#a855f7" fill-opacity="0.25" />
          <circle cx="380" cy="530" r="18" fill="#a855f7" fill-opacity="0.3" />
          <circle cx="280" cy="420" r="12" fill="#c084fc" fill-opacity="0.35" />
          <circle cx="520" cy="360" r="16" fill="#c084fc" fill-opacity="0.25" />
          <!-- Ribbed Hem -->
          <rect x="220" y="635" width="360" height="40" rx="4" fill="#2e1065" stroke="#c084fc" stroke-width="2" />
        
  </g>

  <!-- Bottom Product Tag -->
  <rect x="50" y="860" width="700" height="90" rx="12" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="80" y="905" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="1">SUDADERA OVERSIZE ACID WASH</text>
  <text x="80" y="930" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">PREMIUM EDITION • STUDIO MOCKUP</text>
  
  <rect x="660" y="885" width="60" height="38" rx="6" fill="#c084fc" fill-opacity="0.2" stroke="#c084fc" stroke-opacity="0.6" />
  <text x="690" y="909" text-anchor="middle" fill="#c084fc" font-family="'Inter', sans-serif" font-size="12" font-weight="800">FM</text>
</svg>