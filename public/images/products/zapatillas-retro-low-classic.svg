<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1409" />
      <stop offset="50%" stop-color="#2a1e0d" />
      <stop offset="100%" stop-color="#0d0904" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.8" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.55" />
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="1000" fill="url(#bgGrad)" />
  <rect width="800" height="1000" fill="url(#grid)" />
  <circle cx="400" cy="450" r="350" fill="url(#glow)" />

  <!-- Studio Ambient Lighting Frame -->
  <rect x="30" y="30" width="740" height="940" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" rx="16" />

  <!-- Category & Brand Header -->
  <text x="60" y="80" fill="#fbbf24" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" letter-spacing="4">FASHIONMARKET // ZAPATILLAS</text>
  <text x="740" y="80" text-anchor="end" fill="#ffffff" fill-opacity="0.3" font-family="'Inter', sans-serif" font-size="12" font-weight="600" letter-spacing="2">ED. 2026</text>

  <!-- Main Illustration Group with Filter -->
  <g filter="url(#shadow)" transform="translate(0, 20)">
    
          <!-- 80s Retro Court Low Sneaker -->
          <!-- Classic Caramel Gum Sole -->
          <path d="M130 540 Q250 560 400 550 Q560 540 670 510 L670 560 Q520 595 380 595 Q200 585 130 565 Z" fill="#d97706" stroke="#b45309" stroke-width="2.5" />
          <line x1="140" y1="565" x2="665" y2="560" stroke="#78350f" stroke-width="2" stroke-dasharray="8 4" />
          <!-- Cream Leather Upper -->
          <path d="M150 540 C170 490 240 460 320 440 L440 370 C480 360 520 390 540 420 L640 470 C660 485 665 505 655 520 L150 540 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2.5" />
          <!-- Retro Side Stripes -->
          <path d="M300 480 L480 410 L490 435 L310 505 Z" fill="#0f172a" />
          <path d="M330 505 L510 435 L520 460 L340 530 Z" fill="#d97706" />
          <!-- Perforated Toe Box -->
          <circle cx="230" cy="490" r="3" fill="#64748b" />
          <circle cx="245" cy="495" r="3" fill="#64748b" />
          <circle cx="260" cy="500" r="3" fill="#64748b" />
          <circle cx="240" cy="510" r="3" fill="#64748b" />
          <!-- Low Collar & Heel -->
          <path d="M480 370 C465 330 500 320 530 350 L560 420 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
        
  </g>

  <!-- Bottom Product Tag -->
  <rect x="50" y="860" width="700" height="90" rx="12" fill="#000000" fill-opacity="0.4" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="80" y="905" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="1">ZAPATILLAS RETRO LOW CLASSIC</text>
  <text x="80" y="930" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="500">PREMIUM EDITION • STUDIO MOCKUP</text>
  
  <rect x="660" y="885" width="60" height="38" rx="6" fill="#fbbf24" fill-opacity="0.2" stroke="#fbbf24" stroke-opacity="0.6" />
  <text x="690" y="909" text-anchor="middle" fill="#fbbf24" font-family="'Inter', sans-serif" font-size="12" font-weight="800">FM</text>
</svg>